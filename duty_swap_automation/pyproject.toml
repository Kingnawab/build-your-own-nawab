[project]
name = "duty_swap_automation"
version = "0.1.0"
description = "Daily CrewAI flow that reads duty-swap request emails, updates the Excel duty roster on OneDrive/SharePoint, and emails confirmations."
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.0.0",
    "msal>=1.28",
    "requests>=2.31",
    "openpyxl>=3.1",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kickoff = "duty_swap_automation.main:kickoff"
run_crew = "duty_swap_automation.main:kickoff"
plot = "duty_swap_automation.main:plot"
run_with_trigger = "duty_swap_automation.main:run_with_trigger"
authorize = "duty_swap_automation.graph_client:authorize_cli"
make_sample_data = "duty_swap_automation.sample_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duty_swap_automation"]

[tool.crewai]
type = "flow"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
